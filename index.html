<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dion Puji Ramdani | Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwindcss.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="font-sans antialiased">

    <!-- Ambient 2-Tone Dot Grid Background -->
    <div class="fixed-bg" aria-hidden="true"></div>

    <!-- Celestial Sun Transit Overlay (East to West Sun Movement) -->
    <div id="solar-transit-overlay" class="solar-transit-overlay" aria-hidden="true">
        <div id="solar-celestial-orb" class="solar-celestial-orb">
            <div class="solar-corona"></div>
            <div class="solar-core"></div>
            <div class="solar-rays"></div>
        </div>
        <div class="solar-ambient-sweep"></div>
    </div>

    <!-- Header Navigation Bar with 3D Slab -->
    <nav id="navbar" class="fixed top-0 left-0 right-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
            
            <!-- Left: 3D Theme Toggle Button (Sun turns to Moon based on theme) -->
            <button id="dark-mode-toggle" class="theme-toggle btn-3d" aria-label="Ganti Tema (Matahari & Bulan)" title="Ganti Tema (Matahari Timur ke Barat)">
                <i class="fa-solid fa-sun"></i>
                <i class="fa-solid fa-moon"></i>
            </button>

            <!-- Spacer -->
            <div class="flex-1"></div>

            <!-- Right: 3D Navigation Buttons -->
            <div class="flex gap-2 sm:gap-3">
                <button class="nav-btn btn-3d" data-target="home" aria-label="Home">
                    <i class="fa-solid fa-house"></i>
                    <span class="hidden sm:inline ml-1.5">Home</span>
                </button>
                <button class="nav-btn btn-3d" data-target="documentation" aria-label="Photo">
                    <i class="fa-solid fa-camera"></i>
                    <span class="hidden sm:inline ml-1.5">Photo</span>
                </button>
                <button class="nav-btn btn-3d" data-target="design" aria-label="Design">
                    <i class="fa-solid fa-palette"></i>
                    <span class="hidden sm:inline ml-1.5">Design</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-20 relative z-10 pt-28 sm:pt-32">
        
        <div id="home" class="scroll-section"></div>
        
        <!-- Hero Header -->
        <header class="mb-16 flex flex-col md:flex-row items-center md:items-stretch justify-center md:justify-start gap-8 lg:gap-10">
            
            <!-- 3D Profile Frame -->
            <div class="profile-frame card-3d relative">
                <div class="profile-corner-tag">ARCHIVE</div>
                <img src="img/profile/profile.webp" alt="Dion Puji" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/220/e5e7eb/374151?text=Dion+Puji'">
                <div class="profile-depth-accent" aria-hidden="true"></div>
            </div>
            
            <!-- 3D Name Card -->
            <div class="name-card card-3d p-6 sm:p-8 flex-1 flex flex-col justify-between relative overflow-hidden">
                <div class="relative z-10">
                    <div class="flex items-center justify-between gap-2 mb-3 flex-wrap">
                        <span class="tag-pill-3d">FOLIO // VOL. 01</span>
                        <span class="status-indicator-3d flex items-center gap-1.5 text-xs font-bold">
                            <span class="status-pulse-dot"></span> AVAILABLE FOR COMMISSIONS
                        </span>
                    </div>

                    <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold uppercase tracking-tight mb-2">
                        Dion Puji Ramdani
                    </h1>
                    
                    <div class="role-badge-3d inline-flex items-center gap-2 px-3 py-1.5 font-bold tracking-wider uppercase text-xs sm:text-sm mb-6">
                        <i class="fa-solid fa-crosshairs text-amber-500"></i>
                        <span>Junior Photographer &amp; Graphic Designer</span>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t-2 border-current mt-2 relative z-10">
                    <!-- 3D Tactile Social Icon Blocks -->
                    <div class="flex gap-2.5 sm:gap-3">
                        <a href="https://github.com/Rachuntul" target="_blank" class="social-cube btn-3d" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
                        <a href="https://instagram.com/dionimbus/" target="_blank" class="social-cube btn-3d" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                        <a href="https://www.tiktok.com/@diyooman" target="_blank" class="social-cube btn-3d" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
                        <a href="mailto:dionpuji12@gmail.com" class="social-cube btn-3d" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
                    </div>
                    
                    <!-- 3D Traktir Kopi Button -->
                    <a href="https://saweria.co/RACHUN" target="_blank" class="btn-saweria btn-3d inline-flex items-center gap-2 px-5 py-2.5 font-extrabold tracking-wider uppercase text-sm">
                        <i class="fa-solid fa-mug-hot"></i>
                        <span>Traktir Kopi</span>
                    </a>
                </div>

                <!-- Decorative Flat 3D Geometric Isometric Watermark -->
                <div class="decorative-3d-cube" aria-hidden="true"></div>
            </div>

        </header>

        <!-- Section 1: Photo Gallery -->
        <section id="documentation" class="mb-20 scroll-section">
            <div class="section-header-3d mb-8 flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center gap-3">
                    <div class="section-icon-cube">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                    <div>
                        <span class="section-label-tag">SECTION // 01</span>
                        <h2 class="text-2xl sm:text-3xl font-extrabold uppercase tracking-tight">Photography</h2>
                    </div>
                </div>
                <span id="photo-count-badge" class="badge-count-3d">51 SHOTS</span>
            </div>
            
            <div id="gallery-grid" class="masonry-gallery">
            </div>
        </section>

        <!-- Section 2: Design Gallery -->
        <section id="design" class="scroll-section">
            <div class="section-header-3d mb-8 flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center gap-3">
                    <div class="section-icon-cube">
                        <i class="fa-solid fa-palette"></i>
                    </div>
                    <div>
                        <span class="section-label-tag">SECTION // 02</span>
                        <h2 class="text-2xl sm:text-3xl font-extrabold uppercase tracking-tight">Graphic Design</h2>
                    </div>
                </div>
                <span id="design-count-badge" class="badge-count-3d">3 WORKS</span>
            </div>
            
            <div id="flyer-grid" class="masonry-gallery">
            </div>
        </section>

    </div>

    <!-- Scripts -->
    <script src="js/gallery_data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
